[package]
name = "se-worker"
version = "0.2.0"
edition = "2021"
description = "Surface Evolver worker sidecar — owns one libse instance, speaks line-delimited JSON on stdin/stdout"

# Deliberately standalone rather than a workspace member of src-tauri: making a
# workspace root would relocate src-tauri/target/, which the CI artifact paths,
# the README and tauri's own bundle output all hard-code.
#
# Must NOT depend on tauri — this binary is spawned once per session and wants
# to stay small (the bun sidecar it replaces was 58 MB).

[[bin]]
name = "se-worker"
path = "src/main.rs"

[dependencies]
libloading = "0.8"
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
