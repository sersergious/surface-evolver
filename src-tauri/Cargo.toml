[package]
name = "surface-evolver"
version = "0.2.0"
edition = "2021"
# worker/ is a separate crate that happens to live in this directory — keep it
# out of this package's file set. See worker/Cargo.toml for why it stays
# standalone rather than becoming a workspace member.
exclude = ["worker"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
