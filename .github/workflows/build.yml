name: Build

# Builds the native headless libse on each OS runner (scripts/tauri-before.ts
# → build-native.ts + the compiled se-worker sidecar) and bundles the Tauri
# app. macOS + Linux + Windows (MinGW libse).
#
# There are no version tags. Every push to main whose CI run passes replaces
# the single rolling `latest` release. A red CI run never reaches this file:
# workflow_run only fires on completion, and the job checks the conclusion.
# To rebuild, re-run the CI run (or this one) from the Actions tab.
#
# The macOS app is AD-HOC signed (bundle.macOS.signingIdentity "-" in
# tauri.conf.json) — no Developer ID / notarization. First launch:
# right-click → Open, or `xattr -dr com.apple.quarantine`.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# A newer green push supersedes an in-flight build; its publish replaces every
# asset anyway, so cancelling the older one loses nothing.
concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon → macos-arm64
            artifact: macos-arm64
          - os: ubuntu-latest   # → linux-x64
            artifact: linux-x64
          - os: windows-latest  # → windows-x64 (libse via MinGW/MSYS2)
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      # The commit CI tested, not whatever main points at by now.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/worker

      # Tauri v2 Linux build deps (webkit2gtk renderer).
      # (cmake + a C toolchain are preinstalled on GitHub runners.)
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      # Windows: build libse with MinGW inside MSYS2, stage it, and let
      # tauri-before.ts skip the native rebuild (SE_SKIP_NATIVE below).
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja

      - name: Build libse (MinGW)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -B cmake-build-release -G Ninja -DSE_HEADLESS=ON -DBUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build cmake-build-release
          mkdir -p build-native
          cp cmake-build-release/libse.dll build-native/libse-windows-x64.dll

      - name: Install dependencies
        run: bun install

      - name: Build app (macOS → .dmg)
        if: runner.os == 'macOS'
        run: bunx tauri build

      # AppImage is off. The original cause was linuxdeploy's gtk plugin running
      # ldd over every AppDir executable and aborting on the statically-linked
      # bun-compiled sidecar. That sidecar is gone — the Rust one is a normal
      # dynamically-linked binary that ldd handles — so this is very likely
      # fixable now by adding `appimage` back to --bundles. Left off until
      # someone verifies it on a Linux runner rather than flipping it blind.
      - name: Build app (Linux → .deb)
        if: runner.os == 'Linux'
        run: bunx tauri build --bundles deb

      - name: Build app (Windows → NSIS installer)
        if: runner.os == 'Windows'
        env:
          SE_SKIP_NATIVE: "1"
        run: bunx tauri build --bundles nsis

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp src-tauri/target/release/bundle/dmg/*.dmg "dist/SurfaceEvolver-${{ matrix.artifact }}.dmg"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            cp src-tauri/target/release/bundle/nsis/*.exe "dist/SurfaceEvolver-${{ matrix.artifact }}-setup.exe"
          else
            cp src-tauri/target/release/bundle/deb/*.deb "dist/SurfaceEvolver-${{ matrix.artifact }}.deb"
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: surface-evolver-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  # Runs once, after all three platforms built, so `latest` is never left with
  # a mix of old and new installers. Delete + recreate moves the `latest` tag
  # to the tested commit; the download URLs stay the same.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Replace the rolling `latest` release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          SUBJECT: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          set -euo pipefail
          gh release delete latest --cleanup-tag --yes || true
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/latest" 2>/dev/null || true  # orphaned tag
          gh release create latest dist/* \
            --target "$SHA" \
            --title "Latest build" \
            --latest \
            --notes "Rolling build of \`main\` at ${SHA:0:7}: ${SUBJECT%%$'\n'*}

          Replaced automatically on every push to \`main\` that passes CI. There are no versioned releases."
